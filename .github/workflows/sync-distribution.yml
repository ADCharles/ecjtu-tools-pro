name: Import distribution releases

on:
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-distribution-releases
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Import missing versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/sync_releases.py --source ADCharles/ecjtu-tools-pro-releases --target ADCharles/ecjtu-tools-pro --missing-only --apply
